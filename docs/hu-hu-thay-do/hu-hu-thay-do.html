<style>
/* Layout: dress-up screen. Stage (Hǔhǔ, stacked layers) on the left, wardrobe panel with slot tabs and round item buttons on the right; stacks on phones. */
:root {
  --paper: #FBF4E4; --panel: #FFFDF6; --stage: #E9DFC8; --stage-2: #DCCFB2; --ink: #1B2A6B; --muted: #6A6F5E;
  --forest: #3E6B48; --sage: #587E5C; --gold: #F5C542; --ring: #F5C542; --line: #E5DAC0;
  --chip: #EFE6D0; --on: #3E6B48; --on-ink: #FFFDF6;
  --d-head: #CFE7EE; --d-neck: #DDEFC9; --d-shoulders: #E6DDF3; --d-back: #F6E7C8; --d-hand: #F7DCD2; --d-feet: #D9E6DA;
  --font-display: "Grandstander", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121915; --panel: #1A231D; --stage: #26302A; --stage-2: #1E2722; --ink: #ECEBDD; --muted: #A3AE9F;
  --forest: #8DB693; --sage: #8DB693; --gold: #F5C542; --ring: #F5C542; --line: #2E3B32;
  --chip: #243029; --on: #8DB693; --on-ink: #121915;
  --d-head: #24404A; --d-neck: #2E4226; --d-shoulders: #3A3150; --d-back: #4A3E24; --d-hand: #4A2E28; --d-feet: #2A3A2D; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #121915; --panel: #1A231D; --stage: #26302A; --stage-2: #1E2722; --ink: #ECEBDD; --muted: #A3AE9F;
  --forest: #8DB693; --sage: #8DB693; --gold: #F5C542; --ring: #F5C542; --line: #2E3B32;
  --chip: #243029; --on: #8DB693; --on-ink: #121915;
  --d-head: #24404A; --d-neck: #2E4226; --d-shoulders: #3A3150; --d-back: #4A3E24; --d-hand: #4A2E28; --d-feet: #2A3A2D; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; }
.app { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 460px); gap: 16px; height: 100vh; height: 100dvh; box-sizing: border-box; }
.stage { position: relative; border-radius: 22px; background: radial-gradient(ellipse 26% 5% at 50% 84%, var(--stage-2) 0 98%, transparent 100%), var(--stage); overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.stage header { padding: 18px 20px 0; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; margin: 0; color: var(--forest); line-height: 1.1; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.who { display: inline-flex; gap: 4px; margin-top: 10px; background: var(--panel); border-radius: 99px; padding: 4px; }
.who button { font: 600 14px var(--font-body); color: var(--ink); background: transparent; border: 0; border-radius: 99px; padding: 7px 16px; cursor: pointer; }
.who button[aria-pressed="true"] { background: var(--on); color: var(--on-ink); }
.who button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.figure { position: relative; min-height: 0; display: grid; place-items: center; }
.rig { position: relative; height: 100%; max-height: 640px; aspect-ratio: var(--ar); max-width: 100%; }
.rig img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.side { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); display: grid; gap: 12px; }
.round { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--sage); color: #FFFDF6; display: grid; place-items: center; cursor: pointer; }
.round svg { width: 24px; height: 24px; }
.round:focus-visible, .tab:focus-visible, .item:focus-visible, .preset:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wearing { padding: 0 20px 18px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; align-items: center; }
.wearing .chip { font-size: 12px; background: var(--panel); border-radius: 99px; padding: 4px 10px; display: inline-flex; gap: 6px; align-items: center; }
.wearing .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0; line-height: 1; }
.wearing .total { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wearing .total b { color: var(--ink); }

.panel { background: var(--panel); border-radius: 22px; border: 1px solid var(--line); display: grid; grid-template-rows: auto auto auto 1fr; min-height: 0; overflow: hidden; }
.tabs { display: flex; gap: 6px; padding: 14px 14px 10px; overflow-x: auto; }
.tab { flex: none; font: 600 14px var(--font-body); color: var(--ink); background: var(--chip); border: 0; border-radius: 14px; padding: 9px 14px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--on); color: var(--on-ink); }
.presets { display: flex; gap: 6px; padding: 0 14px 10px; overflow-x: auto; }
.preset { flex: none; font: 500 12px var(--font-body); color: var(--ink); background: transparent; border: 1.5px solid var(--line); border-radius: 99px; padding: 5px 11px; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px 10px; padding: 6px 14px 18px; overflow-y: auto; align-content: start; }
.item { border: 0; background: none; padding: 0; cursor: pointer; display: grid; justify-items: center; gap: 6px; color: var(--ink); font: 500 12px var(--font-body); }
.item .disc { width: 84px; height: 84px; border-radius: 50%; background: var(--disc, var(--chip)); display: grid; place-items: center; box-shadow: inset 0 0 0 3px transparent; transition: box-shadow .15s, transform .15s; }
.item .disc img { width: 66%; height: 66%; object-fit: contain; }
.item:hover .disc { transform: translateY(-2px); }
.item[aria-pressed="true"] .disc { box-shadow: inset 0 0 0 4px var(--ring); }
.item .name { text-align: center; line-height: 1.25; max-width: 96px; text-wrap: balance; }
.item .price { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.land { margin: 0 14px 8px; border-radius: 16px; background: var(--chip); padding: 12px 14px; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 12px; align-items: start; }
.land[hidden] { display: none; }
.land img { grid-row: span 4; width: 64px; height: 64px; object-fit: contain; border-radius: 50%; background: var(--panel); padding: 6px; box-sizing: border-box; }
.land .t { font: 700 15px var(--font-body); margin: 0; }
.land .a { margin: 0; font-size: 13px; line-height: 1.4; }
.land .r { margin: 4px 0 0; font: 600 12px var(--font-body); color: var(--forest); }
.land .r span { color: var(--muted); font-weight: 500; }
.land .s { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .stage { min-height: 0; }
  .figure { height: 56vh; }
  .panel { height: 70vh; }
}
@media (prefers-reduced-motion: reduce) { .item .disc { transition: none; } .item:hover .disc { transform: none; } }
</style>

    <div class="figure">

    <div class="wearing" id="wearing" aria-live="polite"></div>
  </section>

  <section class="panel" aria-label="Tủ đồ">

      <img alt=""><p class="t"></p><p class="a"></p><p class="r"></p><p class="s"></p>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

gay-tre", "name": "Gậy Tre", "slot": "hand", "slotVi": "Tay", "z": 7, "region": "C1", "about": "Gậy tre đi đường của Dudu, chặt từ con đường tre trong xóm."}]}], "outfits": [{"name": "Nhà du hành gió", "ids": ["mu-chin-tang-gio", "chuoi-da-bay", "dieu-la"]}, {"name": "Người canh trăng", "ids": ["mu-trang-khuyet", "mat-day-vong-trang", "sach-buom-dem"]}, {"name": "Rừng thức dậy", "ids": ["vong-dom-dom", "khan-nam-dong-song", "tui-hat-mam"]}, {"name": "Hiệp sĩ đá", "ids": ["ao-choang-vay-da", "chuoi-da-bay", "ong-tre"]}, {"name": "Phố mái ngói", "ids": ["hoa-hai-mau", "tui-mai-ngoi"]}, {"name": "Dudu thường ngày", "ids": ["non-la-dudu", "gay-tre"]}], "regions": {"C0": {"name": "Nhà Nhỏ Bên Đồi", "en": "Little House on the Hill", "keeper": "", "story": "Bé tìm thấy bản đồ cũ của ông bà cố trong nhà. Tấm bản đồ có những vùng đất lạ. Bé chọn bạn đồng hành và bắt đầu chuyến đi."}, "C1": {"name": "Xóm Tre Đèn Sáng", "en": "Bamboo Lantern Hamlet", "keeper": "🐕 Chó Đội Nón", "story": "Bé đến một ngôi làng nhỏ. Chó nhận ra chiếc nón quen thuộc và dẫn bé đi qua con đường tre khi những chiếc đèn lần lượt sáng lên."}, "C2": {"name": "Rừng Ngàn Mắt", "en": "Forest of a Thousand Eyes", "keeper": "🐯 Hổ Tinh", "story": "Trong khu rừng, bé nhìn thấy những đôi mắt sáng giữa tán lá. Hổ bật mí đó chỉ là những người bạn đang chơi trốn tìm."}, "C3": {"name": "Bến Năm Dòng", "en": "Five-Stream Wharf", "keeper": "🐊 Sấu Năm Chèo", "story": "Bé đến một bến nước nơi dòng sông chia thành nhiều nhánh. Sấu xuất hiện và khoe điều đặc biệt nhất của mình: năm chiếc chân."}, "C4": {"name": "Vịnh Nuốt Trăng", "en": "Moon-Swallowing Bay", "keeper": "🐟 Ngư Tinh", "story": "Bé đến biển vào một đêm trăng. Ngư Tinh xuất hiện dưới mặt nước và chơi đùa với bóng trăng trên lưng mình."}, "C5": {"name": "Rừng Thất Trúc", "en": "Seven-Node Bamboo Forest", "keeper": "🐻 Hùng Tinh", "story": "Bé gặp Hùng Tinh giữa rừng trúc. Hùng Tinh rất yêu một cây trúc đặc biệt và cùng bé đếm đủ bảy đốt trên thân cây."}, "C6": {"name": "Rừng Đá Nhảy", "en": "Jumping Stone Forest", "keeper": "🐒 Hầu Tinh", "story": "Bé nghe tiếng động trong rừng rồi gặp Hầu Tinh. Hầu Tinh đưa bé xem cách mình nhảy từ tảng đá này sang tảng đá khác."}, "C7": {"name": "Đỉnh Chín Tầng Gió", "en": "Nine-Wind Peak", "keeper": "🦅 Đại Bàng Tinh", "story": "Bé leo lên một ngọn núi đầy gió và gặp Đại Bàng Tinh. Đại Bàng bay rất giỏi nhưng vẫn đang tập cách hạ cánh thật đẹp."}, "C8": {"name": "Thung Lũng Vảy Đá", "en": "Stone-Scale Valley", "keeper": "🐍 Chằn Tinh", "story": "Bé nhìn thấy những dấu dài uốn quanh các tảng đá. Chằn Tinh xuất hiện và tiết lộ đó là dấu mình để lại."}, "C9": {"name": "Vực Ngân Nguyệt", "en": "Silver Moon Gorge", "keeper": "🐉 Thuồng Luồng", "story": "Bé đến một vực nước sáng dưới ánh trăng. Thuồng Luồng nhút nhát xuất hiện và dẫn bé xem nơi mình thích bơi nhất."}, "C10": {"name": "Đồng Cỏ Gió Chạy", "en": "Wind-Racing Meadow", "keeper": "🐰 Thỏ Tinh", "story": "Bé gặp Thỏ Tinh trên một đồng cỏ rộng. Thỏ chạy nhanh đến mức tưởng như đang chạy đua với gió."}, "C11": {"name": "Phố Mái Ngói", "en": "Tiled-Roof Street", "keeper": "🐭 Chuột Tinh", "story": "Khi trời tối, bé nghe tiếng động trên những mái nhà. Chuột Tinh xuất hiện và chơi trò trốn tìm trên mái ngói."}, "C12": {"name": "Vườn Hoa Ảo Ảnh", "en": "Mirage Flower Garden", "keeper": "🦊 Cáo Quỷ", "story": "Ở điểm cuối bản đồ, bé gặp Cáo Quỷ trong một khu vườn kỳ lạ. Những bông hoa liên tục đổi màu và hình dạng."}}};
const SLOTS = [["all", "Tất cả"], ["head", "Đầu"], ["neck", "Cổ"], ["shoulders", "Vai"], ["back", "Lưng"], ["hand", "Tay"], ["feet", "Chân"]];
const ORDER = ["head", "neck", "shoulders", "back", "hand", "feet"];
const DISC = { head: "var(--d-head)", neck: "var(--d-neck)", shoulders: "var(--d-shoulders)", back: "var(--d-back)", hand: "var(--d-hand)", feet: "var(--d-feet)" };
const KEY = "huhu-thay-do-v2";
const empty = () => Object.fromEntries(ORDER.map(s => [s, null]));
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
let M, byId, worn, tab = "all";

const rig = document.getElementById("rig");
const cache = {};
function layer(name) {
  const src = M.id + "/layers/" + name + ".webp";
  if (!cache[src]) { const im = new Image(); im.src = src; im.alt = ""; im.decoding = "async"; cache[src] = im; }
  return cache[src];
}
function pick(id) {
  M = DATA.mascots.find(m => m.id === id) || DATA.mascots[0];
  byId = Object.fromEntries(M.items.map(i => [i.id, i]));
  worn = empty();
  const s = store[M.id] || {};
  for (const k in worn) if (byId[s[k]]) worn[k] = s[k];
  store.who = M.id;
  rig.style.setProperty("--ar", M.size[0] + " / " + M.size[1]);
  document.getElementById("title").textContent = M.name + " Thay Đồ";
  document.querySelectorAll("#who button").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === M.id ? "true" : "false"));
  buildPresets(); buildGrid(); render(); save();
  for (const name of ["body", "wisps"]) layer(name);
}

function render() {
  const on = ORDER.map(k => worn[k] && byId[worn[k]]).filter(Boolean).sort((x, y) => x.z - y.z);
  const stack = on.filter(i => i.z === 0).map(i => i.id);
  stack.push("body");
  for (const i of on) if (i.z > 0) stack.push(i.id + "-sh");
  for (const i of on) if (i.z > 0) stack.push(i.id);
  stack.push("wisps");                       // ghost wisps always float in front
  rig.replaceChildren(...stack.map(layer));

  const w = document.getElementById("wearing"); w.textContent = "";
  let total = 0;
  for (const slot of ORDER) {
    const it = worn[slot] && byId[worn[slot]]; if (!it) continue;
    total += 1;
    const c = document.createElement("span"); c.className = "chip";
    c.append(it.slotVi + ": " + it.name);
    const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Cởi " + it.name);
    x.onclick = () => { worn[slot] = null; save(); render(); };
    c.append(x); w.append(c);
  }
  if (!total) { const s = document.createElement("span"); s.className = "sub"; s.textContent = M.name + " chưa mặc gì."; w.append(s); }
  else { const t = document.createElement("span"); t.className = "total"; t.innerHTML = "<b></b> món"; t.querySelector("b").textContent = total; w.append(t); }

  document.querySelectorAll(".item").forEach(b => b.setAttribute("aria-pressed", worn[byId[b.dataset.id].slot] === b.dataset.id ? "true" : "false"));
}
function save() { store[M.id] = worn; try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function toggle(id) { const s = byId[id].slot; worn[s] = worn[s] === id ? null : id; save(); render(); showLand(id); }
function showLand(id) {                      // the land the item comes from (Brief §09B)
  const it = byId[id], el = document.getElementById("land"), R = it && DATA.regions[it.region];
  if (!R) { el.hidden = true; return; }
  el.hidden = false;
  el.querySelector("img").src = "thumbs/" + it.id + ".webp";
  el.querySelector(".t").textContent = it.name;
  el.querySelector(".a").textContent = it.about;
  const r = el.querySelector(".r"); r.textContent = it.region + " · " + R.name + " ";
  const sp = document.createElement("span"); sp.textContent = (R.keeper ? "· " + R.keeper : "· " + R.en); r.append(sp);
  el.querySelector(".s").textContent = R.story;
}

function buildWho() {
  const el = document.getElementById("who");
  for (const m of DATA.mascots) {
    const b = document.createElement("button"); b.type = "button"; b.dataset.id = m.id; b.textContent = m.name;
    b.onclick = () => pick(m.id);
    el.append(b);
  }
}
function buildTabs() {
  const el = document.getElementById("tabs");
  const used = new Set(DATA.mascots.flatMap(m => m.items.map(i => i.slot)));
  for (const [k, label] of SLOTS) {
    if (k !== "all" && !used.has(k)) continue;      // no tab for a slot with nothing in it
    const b = document.createElement("button"); b.type = "button"; b.className = "tab"; b.role = "tab"; b.textContent = label;
    b.setAttribute("aria-selected", k === tab ? "true" : "false");
    b.onclick = () => { tab = k; el.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === b ? "true" : "false")); buildGrid(); render(); };
    el.append(b);
  }
}
function buildGrid() {
  const g = document.getElementById("grid"); g.textContent = "";
  for (const it of M.items) {
    if (tab !== "all" && it.slot !== tab) continue;
    const b = document.createElement("button"); b.type = "button"; b.className = "item"; b.dataset.id = it.id;
    b.innerHTML = '<span class="disc"><img alt="" loading="lazy"></span><span class="name"></span><span class="price"></span>';
    b.style.setProperty("--disc", DISC[it.slot]);
    b.querySelector("img").src = "thumbs/" + it.id + ".webp";
    b.querySelector(".name").textContent = it.name;
    b.querySelector(".price").textContent = it.slotVi + (it.region ? " · " + it.region : "");
    b.onclick = () => toggle(it.id);
    g.append(b);
  }
}
function buildPresets() {
  const el = document.getElementById("presets"); el.textContent = "";
  for (const o of DATA.outfits) {
    if (!o.ids.every(id => byId[id])) continue;      // e.g. Dudu's own hat and stick
    const b = document.createElement("button"); b.type = "button"; b.className = "preset"; b.textContent = o.name;
    b.onclick = () => { worn = empty(); for (const id of o.ids) worn[byId[id].slot] = id; save(); render(); };
    el.append(b);
  }
}
document.getElementById("reset").onclick = () => { worn = empty(); save(); render(); };
document.getElementById("random").onclick = () => {
  for (const s of ORDER) {
    const pool = M.items.filter(i => i.slot === s);
    worn[s] = Math.random() < (s === "head" || s === "neck" ? 0.85 : 0.4) ? pool[Math.floor(Math.random() * pool.length)].id : null;
  }
  save(); render();
};
buildWho(); buildTabs(); pick(store.who || "huhu");
</script>
