<title>Tủ đồ Hǔhǔ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: dress-up screen. Stage (Hǔhǔ, stacked layers) on the left, wardrobe panel with slot tabs and round item buttons on the right; stacks on phones. */
:root {
  --paper: #FBF4E4; --panel: #FFFDF6; --stage: #E9DFC8; --stage-2: #DCCFB2; --ink: #1B2A6B; --muted: #6A6F5E;
  --forest: #3E6B48; --sage: #587E5C; --gold: #F5C542; --ring: #F5C542; --line: #E5DAC0;
  --chip: #EFE6D0; --on: #3E6B48; --on-ink: #FFFDF6;
  --font-display: "Grandstander", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121915; --panel: #1A231D; --stage: #26302A; --stage-2: #1E2722; --ink: #ECEBDD; --muted: #A3AE9F;
  --forest: #8DB693; --sage: #8DB693; --gold: #F5C542; --ring: #F5C542; --line: #2E3B32;
  --chip: #243029; --on: #8DB693; --on-ink: #121915; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #121915; --panel: #1A231D; --stage: #26302A; --stage-2: #1E2722; --ink: #ECEBDD; --muted: #A3AE9F;
  --forest: #8DB693; --sage: #8DB693; --gold: #F5C542; --ring: #F5C542; --line: #2E3B32;
  --chip: #243029; --on: #8DB693; --on-ink: #121915; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; }
.app { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 460px); gap: 16px; min-height: calc(100% - 32px); box-sizing: border-box; }
.stage { position: relative; border-radius: 22px; background: radial-gradient(ellipse at 50% 88%, var(--stage-2) 0 22%, transparent 23%), var(--stage); overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; min-height: 520px; }
.stage header { padding: 18px 20px 0; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; margin: 0; color: var(--forest); line-height: 1.1; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.figure { position: relative; height: 100%; min-height: 380px; display: grid; place-items: center; }
.rig { position: relative; height: min(70vh, 640px); aspect-ratio: var(--ar); max-width: 100%; }
.rig img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.side { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); display: grid; gap: 12px; }
.round { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--sage); color: #FFFDF6; display: grid; place-items: center; cursor: pointer; }
.round svg { width: 24px; height: 24px; }
.round:focus-visible, .tab:focus-visible, .item:focus-visible, .preset:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wearing { padding: 0 20px 18px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; align-items: center; }
.wearing .chip { font-size: 12px; background: var(--panel); border-radius: 99px; padding: 4px 10px; display: inline-flex; gap: 6px; align-items: center; }
.wearing .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0; line-height: 1; }
.wearing .total { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wearing .total b { color: var(--ink); }

.panel { background: var(--panel); border-radius: 22px; border: 1px solid var(--line); display: grid; grid-template-rows: auto auto 1fr; min-height: 0; overflow: hidden; }
.tabs { display: flex; gap: 6px; padding: 14px 14px 10px; overflow-x: auto; }
.tab { flex: none; font: 600 14px var(--font-body); color: var(--ink); background: var(--chip); border: 0; border-radius: 14px; padding: 9px 14px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--on); color: var(--on-ink); }
.presets { display: flex; gap: 6px; padding: 0 14px 10px; overflow-x: auto; }
.preset { flex: none; font: 500 12px var(--font-body); color: var(--ink); background: transparent; border: 1.5px solid var(--line); border-radius: 99px; padding: 5px 11px; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px 10px; padding: 6px 14px 18px; overflow-y: auto; align-content: start; }
.item { border: 0; background: none; padding: 0; cursor: pointer; display: grid; justify-items: center; gap: 6px; color: var(--ink); font: 500 12px var(--font-body); }
.item .disc { width: 84px; height: 84px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; box-shadow: inset 0 0 0 3px transparent; transition: box-shadow .15s, transform .15s; }
.item .disc img { width: 66%; height: 66%; object-fit: contain; }
.item:hover .disc { transform: translateY(-2px); }
.item[aria-pressed="true"] .disc { box-shadow: inset 0 0 0 4px var(--ring); background: var(--stage); }
.item .name { text-align: center; line-height: 1.25; max-width: 96px; text-wrap: balance; }
.item .price { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .rig { height: min(56vh, 520px); }
  .panel { min-height: 420px; }
}
@media (prefers-reduced-motion: reduce) { .item .disc { transition: none; } .item:hover .disc { transform: none; } }
</style>

<div class="app">
  <section class="stage" aria-label="Hǔhǔ">
    <header>
      <h1>Tủ đồ Hǔhǔ</h1>
      <p class="sub">Chạm một món để Hǔhǔ mặc thử. Mỗi chỗ đầu, cổ, tay mặc được một món.</p>
    </header>
    <div class="figure">
      <div class="rig" id="rig"></div>
      <div class="side">
        <button class="round" id="reset" type="button" aria-label="Cởi hết đồ" title="Cởi hết đồ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button class="round" id="random" type="button" aria-label="Phối ngẫu nhiên" title="Phối ngẫu nhiên">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <div class="wearing" id="wearing" aria-live="polite"></div>
  </section>

  <section class="panel" aria-label="Tủ đồ">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="presets" id="presets" aria-label="Bộ phối sẵn"></div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
const DATA = {"size": [649, 900], "items": [{"id": "non-la", "name": "Nón lá", "slot": "head", "slotVi": "Đầu", "price": 40, "covered": true}, {"id": "khan-ran", "name": "Khăn rằn", "slot": "neck", "slotVi": "Cổ", "price": 40, "covered": false}, {"id": "no-buom", "name": "Nơ bướm", "slot": "neck", "slotVi": "Cổ", "price": 40, "covered": false}, {"id": "vong-hoa", "name": "Vòng hoa", "slot": "head", "slotVi": "Đầu", "price": 40, "covered": false}, {"id": "khan-quang-la", "name": "Khăn quàng lá", "slot": "neck", "slotVi": "Cổ", "price": 40, "covered": false}, {"id": "dieu-giay", "name": "Diều giấy", "slot": "hand", "slotVi": "Tay", "price": 80, "covered": false}, {"id": "trong-com", "name": "Trống cơm", "slot": "neck", "slotVi": "Cổ", "price": 80, "covered": false}, {"id": "gio-xach-may", "name": "Giỏ xách mây", "slot": "hand", "slotVi": "Tay", "price": 80, "covered": false}, {"id": "mu-la", "name": "Mũ lá", "slot": "head", "slotVi": "Đầu", "price": 80, "covered": false}, {"id": "vong-hat-rung", "name": "Vòng hạt rừng", "slot": "neck", "slotVi": "Cổ", "price": 80, "covered": false}, {"id": "ao-toi-la", "name": "Áo tơi lá", "slot": "neck", "slotVi": "Cổ", "price": 80, "covered": false}, {"id": "mu-chop-la", "name": "Mũ chóp lá", "slot": "head", "slotVi": "Đầu", "price": 80, "covered": true}, {"id": "mu-coi-kinh", "name": "Mũ cối kính bay", "slot": "head", "slotVi": "Đầu", "price": 80, "covered": true}, {"id": "ong-nhom-tre", "name": "Ống nhòm tre", "slot": "hand", "slotVi": "Tay", "price": 80, "covered": false}, {"id": "tui-coi", "name": "Túi cói", "slot": "neck", "slotVi": "Cổ", "price": 80, "covered": false}, {"id": "ong-tre-nuoc", "name": "Ống tre đựng nước", "slot": "neck", "slotVi": "Cổ", "price": 80, "covered": false}, {"id": "mu-thuyen-giay", "name": "Mũ thuyền giấy", "slot": "head", "slotVi": "Đầu", "price": 80, "covered": true}, {"id": "vong-hoa-sung", "name": "Vòng hoa súng", "slot": "head", "slotVi": "Đầu", "price": 80, "covered": false}, {"id": "no-la-dua", "name": "Nơ lá dừa", "slot": "neck", "slotVi": "Cổ", "price": 80, "covered": false}, {"id": "can-cau-tre", "name": "Cần câu tre", "slot": "hand", "slotVi": "Tay", "price": 80, "covered": false}, {"id": "mu-trum-trau", "name": "Mũ trùm sừng trâu", "slot": "head", "slotVi": "Đầu", "price": 80, "covered": true}, {"id": "mo-trau", "name": "Mõ trâu", "slot": "neck", "slotVi": "Cổ", "price": 80, "covered": false}, {"id": "mu-rom", "name": "Mũ rơm", "slot": "head", "slotVi": "Đầu", "price": 80, "covered": true}, {"id": "sao-truc", "name": "Sáo trúc", "slot": "hand", "slotVi": "Tay", "price": 80, "covered": false}, {"id": "khan-dong", "name": "Khăn đóng", "slot": "head", "slotVi": "Đầu", "price": 80, "covered": true}, {"id": "canh-mai", "name": "Cành mai cài", "slot": "head", "slotVi": "Đầu", "price": 80, "covered": false}, {"id": "khanh-bac", "name": "Khánh bạc", "slot": "neck", "slotVi": "Cổ", "price": 80, "covered": false}, {"id": "tui-gam", "name": "Túi gấm", "slot": "neck", "slotVi": "Cổ", "price": 80, "covered": false}, {"id": "non-quai-thao", "name": "Nón quai thao", "slot": "head", "slotVi": "Đầu", "price": 150, "covered": true}, {"id": "canh-dieu-sao", "name": "Cánh diều sáo", "slot": "hand", "slotVi": "Tay", "price": 150, "covered": false}, {"id": "ao-choang-tho-cam", "name": "Áo choàng thổ cẩm", "slot": "neck", "slotVi": "Cổ", "price": 150, "covered": false}, {"id": "bang-do-may", "name": "Băng đô mây", "slot": "head", "slotVi": "Đầu", "price": 80, "covered": true}], "outfits": [{"name": "Đi rừng", "ids": ["mu-la", "vong-hat-rung", "ong-nhom-tre"]}, {"name": "Nhà thám hiểm", "ids": ["mu-coi-kinh", "tui-coi", "ong-nhom-tre"]}, {"name": "Miền Tây", "ids": ["non-la", "khan-ran", "can-cau-tre"]}, {"name": "Sông nước", "ids": ["mu-thuyen-giay", "no-la-dua", "can-cau-tre"]}, {"name": "Đồng quê", "ids": ["mu-rom", "mo-trau", "sao-truc"]}, {"name": "Tết", "ids": ["canh-mai", "khanh-bac", "gio-xach-may"]}, {"name": "Hội làng", "ids": ["vong-hoa", "trong-com", "dieu-giay"]}, {"name": "Kinh Bắc", "ids": ["non-quai-thao", "ao-choang-tho-cam", "canh-dieu-sao"]}]};
const SLOTS = [["all", "Tất cả"], ["head", "Đầu"], ["neck", "Cổ"], ["hand", "Tay"]];
const byId = Object.fromEntries(DATA.items.map(i => [i.id, i]));
let worn = { head: null, neck: null, hand: null };
let tab = "all";
try { const s = JSON.parse(localStorage.getItem("tudo-worn") || "null"); if (s) for (const k in worn) if (byId[s[k]]) worn[k] = s[k]; } catch (e) {}

const rig = document.getElementById("rig");
rig.style.setProperty("--ar", DATA.size[0] + " / " + DATA.size[1]);
const cache = {};
function layer(name) {
  if (!cache[name]) { const im = new Image(); im.src = "layers/" + name + ".webp"; im.alt = ""; im.decoding = "async"; cache[name] = im; }
  return cache[name];
}

function render() {
  const h = worn.head && byId[worn.head], n = worn.neck, hd = worn.hand;
  const stack = [h && h.covered ? "body-noears" : "body"];
  for (const id of [worn.neck, worn.head, worn.hand]) if (id) stack.push(id + "-sh");
  if (n) stack.push(n, "head-front");
  if (h) { stack.push(h.id); if (!h.covered) stack.push("ears-front"); }
  if (hd) stack.push(hd);
  rig.replaceChildren(...stack.map(layer));

  const w = document.getElementById("wearing"); w.textContent = "";
  let total = 0;
  for (const slot of ["head", "neck", "hand"]) {
    const it = worn[slot] && byId[worn[slot]]; if (!it) continue;
    total += it.price;
    const c = document.createElement("span"); c.className = "chip";
    c.append(it.slotVi + ": " + it.name);
    const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Cởi " + it.name);
    x.onclick = () => { worn[slot] = null; save(); render(); };
    c.append(x); w.append(c);
  }
  if (!total) { const s = document.createElement("span"); s.className = "sub"; s.textContent = "Hǔhǔ chưa mặc gì."; w.append(s); }
  else { const t = document.createElement("span"); t.className = "total"; t.innerHTML = "Tổng <b></b> bánh cam"; t.querySelector("b").textContent = total; w.append(t); }

  document.querySelectorAll(".item").forEach(b => b.setAttribute("aria-pressed", worn[byId[b.dataset.id].slot] === b.dataset.id ? "true" : "false"));
}
function save() { try { localStorage.setItem("tudo-worn", JSON.stringify(worn)); } catch (e) {} }
function toggle(id) { const s = byId[id].slot; worn[s] = worn[s] === id ? null : id; save(); render(); }

function buildTabs() {
  const el = document.getElementById("tabs");
  for (const [k, label] of SLOTS) {
    const b = document.createElement("button"); b.type = "button"; b.className = "tab"; b.role = "tab"; b.textContent = label;
    b.setAttribute("aria-selected", k === tab ? "true" : "false");
    b.onclick = () => { tab = k; el.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === b ? "true" : "false")); buildGrid(); render(); };
    el.append(b);
  }
}
function buildGrid() {
  const g = document.getElementById("grid"); g.textContent = "";
  for (const it of DATA.items) {
    if (tab !== "all" && it.slot !== tab) continue;
    const b = document.createElement("button"); b.type = "button"; b.className = "item"; b.dataset.id = it.id;
    b.innerHTML = '<span class="disc"><img alt="" loading="lazy"></span><span class="name"></span><span class="price"></span>';
    b.querySelector("img").src = "thumbs/" + it.id + ".webp";
    b.querySelector(".name").textContent = it.name;
    b.querySelector(".price").textContent = it.price + " bánh cam";
    b.onclick = () => toggle(it.id);
    g.append(b);
  }
}
function buildPresets() {
  const el = document.getElementById("presets");
  for (const o of DATA.outfits) {
    const b = document.createElement("button"); b.type = "button"; b.className = "preset"; b.textContent = o.name;
    b.onclick = () => { worn = { head: null, neck: null, hand: null }; for (const id of o.ids) worn[byId[id].slot] = id; save(); render(); };
    el.append(b);
  }
}
document.getElementById("reset").onclick = () => { worn = { head: null, neck: null, hand: null }; save(); render(); };
document.getElementById("random").onclick = () => {
  for (const s of ["head", "neck", "hand"]) {
    const pool = DATA.items.filter(i => i.slot === s);
    worn[s] = Math.random() < 0.8 ? pool[Math.floor(Math.random() * pool.length)].id : null;
  }
  save(); render();
};
buildTabs(); buildPresets(); buildGrid(); render();
for (const name of ["body", "body-noears", "head-front", "ears-front"]) layer(name);
</script>
